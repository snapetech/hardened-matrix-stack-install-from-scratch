# Synapse-aware nginx hardening. Include in the 443 server block for your Matrix host.
# 1) Include the zone file in http { } (e.g. in nginx.conf or a conf.d file that's in http):
#    include /etc/nginx/snippets/synapse-rate-limit-zones.conf;
# 2) Include this file inside the server { } block BEFORE the main location ~ ^(/_matrix|/_synapse/client).
#
# Critical: do NOT add a path after proxy_pass (no trailing slash) — Synapse federation
# signatures can break on URI normalization. Ref: Synapse reverse proxy docs.

# Lock down Synapse admin and metrics (evaluate before general _matrix proxy)
location ~ ^/_synapse/admin {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    proxy_pass http://127.0.0.1:8008;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_http_version 1.1;
}

location = /_synapse/metrics {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    proxy_pass http://127.0.0.1:8008;
    proxy_set_header Host $host;
}

# Targeted rate limiting: login and register only (do not throttle full /_matrix — hurts sync)
location = /_matrix/client/v3/login {
    limit_req zone=login_zone burst=10 nodelay;
    proxy_pass http://127.0.0.1:8008;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_http_version 1.1;
}

location = /_matrix/client/v3/register {
    limit_req zone=reg_zone burst=5 nodelay;
    proxy_pass http://127.0.0.1:8008;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_http_version 1.1;
}

# Legacy r0 paths (if you still serve them)
location = /_matrix/client/r0/login {
    limit_req zone=login_zone burst=10 nodelay;
    proxy_pass http://127.0.0.1:8008;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_http_version 1.1;
}

location = /_matrix/client/r0/register {
    limit_req zone=reg_zone burst=5 nodelay;
    proxy_pass http://127.0.0.1:8008;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_http_version 1.1;
}
