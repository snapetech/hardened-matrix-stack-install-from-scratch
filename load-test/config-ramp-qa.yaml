safety:
  load1_max: 35
  consecutive_errors_max: 10
  # Three loads: orchestrator_host (machine running this harness / general system), client_node (node where QA client pods run), stack_node (Synapse/QA server host).
  # safety_load_ssh = node where loadtest PODS run (SSH for /proc/loadavg) → reported as client_node.
  safety_load_ssh: "kspld0"
  # stack_load_ssh = node where Synapse/QA server runs. When set, we SSH there for stack_node. When unset, use stack_on_orchestrator.
  # stack_load_ssh: "other-node"
  # stack_on_orchestrator: true = Synapse runs on same host as the harness; stack_node is then the same as orchestrator_host.
  stack_on_orchestrator: true
