# Synapse QA: minimal instance for testing the Matrix client API in Kubernetes.
# Init generates config+keys; main runs Synapse. No TLS (use NodePort or port-forward).
# With postgres.yaml applied, Synapse uses PostgreSQL; otherwise SQLite.
#
# Server resource config for load-test comparison (this file = 1c/1g):
#   - This deployment: Synapse limits 1 CPU / 1 Gi (nail down server load at 1–10 participants).
#   - For 4c/4g: kubectl apply -f k8s-qa/synapse-deployment-4c4g.yaml (same deployment name, replaces this).
# Apply: kubectl apply -f k8s-qa/
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synapse
  namespace: matrix-qa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: synapse
  template:
    metadata:
      labels:
        app: synapse
    spec:
      tolerations:
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: generate
          image: matrixdotorg/synapse:v1.107.0
          args: ["generate"]
          env:
            - name: SYNAPSE_SERVER_NAME
              value: "qa.local"
            - name: SYNAPSE_REPORT_STATS
              value: "no"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "350m"
          volumeMounts:
            - name: data
              mountPath: /data
        - name: patch-config
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              sed -i 's/^registration_shared_secret:.*/registration_shared_secret: "qa-test-registration-secret"/' /data/homeserver.yaml || echo 'registration_shared_secret: "qa-test-registration-secret"' >> /data/homeserver.yaml
              grep -q "enable_registration_without_verification" /data/homeserver.yaml || printf '\nenable_registration_without_verification: true\n' >> /data/homeserver.yaml
              mkdir -p /data/conf.d
              # QA only: relax all client-facing rate limits so create_test_users and ramp never see 429. Live/VM deploy does not use this manifest.
              { printf '%s\n' "ratelimiting:" "  rc_registration:" "    per_second: 100" "    burst_count: 1000" "  rc_login:" "    address:" "      per_second: 100" "      burst_count: 1000" "    account:" "      per_second: 100" "      burst_count: 1000" "    failed_attempts:" "      per_second: 100" "      burst_count: 1000" "  rc_message:" "    per_second: 100" "    burst_count: 1000" "  rc_joins:" "    per_second: 100" "    burst_count: 1000" "  rc_delayed_event_mgmt:" "    per_second: 100" "    burst_count: 1000"; } > /data/conf.d/98-ratelimit-qa.yaml
              printf 'enable_metrics: true\nlisteners:\n  - port: 8008\n    tls: false\n    type: http\n    x_forwarded: true\n    bind_addresses: ["0.0.0.0"]\n    resources:\n      - names: [client, federation, metrics]\n        compress: false\n' > /data/conf.d/99-metrics.yaml
              chown -R 991:991 /data
          volumeMounts:
            - name: data
              mountPath: /data
        - name: configure-database
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /data/conf.d
              if [ -n "$SYNAPSE_DB_PASSWORD" ]; then
                printf 'database:\n  name: psycopg2\n  args:\n    database: synapse\n    user: synapse\n    host: postgres\n    port: 5432\n    password: %s\n    cp_min: 2\n    cp_max: 10\n  allow_unsafe_locale: true\n' "$SYNAPSE_DB_PASSWORD" > /data/conf.d/database.yaml
                chown 991:991 /data/conf.d/database.yaml
              fi
          env:
            - name: SYNAPSE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_PASSWORD
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /data
        - name: configure-turn
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              if [ -n "$TURN_SHARED_SECRET" ]; then
                printf 'turn_uris:\n  - "turn:coturn:3478?transport=udp"\n  - "turn:coturn:3478?transport=tcp"\nturn_shared_secret: "%s"\nturn_user_lifetime: 86400000\nturn_allow_guests: false\n' "$TURN_SHARED_SECRET" > /data/conf.d/turn.yaml
                chown 991:991 /data/conf.d/turn.yaml
              fi
          env:
            - name: TURN_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: coturn
                  key: turn_shared_secret
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: synapse
          image: matrixdotorg/synapse:v1.107.0
          # Load homeserver.yaml + conf.d (database.yaml, turn.yaml) so we use Postgres and TURN
          command:
            - /bin/sh
            - -c
            - exec python -m synapse.app.homeserver --config-path /data/homeserver.yaml --config-path /data/conf.d
          ports:
            - containerPort: 8008
              name: http
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /_matrix/client/versions
              port: 8008
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
      volumes:
        - name: data
          emptyDir: {}
---
# ClusterIP only; all client traffic goes through nginx (NodePort 30048).
apiVersion: v1
kind: Service
metadata:
  name: synapse
  namespace: matrix-qa
spec:
  type: ClusterIP
  selector:
    app: synapse
  ports:
    - port: 8008
      targetPort: 8008
      name: http
---
apiVersion: v1
kind: Secret
metadata:
  name: synapse-secrets
  namespace: matrix-qa
type: Opaque
stringData:
  registration-shared-secret: "qa-test-registration-secret"
