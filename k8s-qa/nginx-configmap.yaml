# nginx in front of Synapse: same functions as VM installer (proxy, no-federation).
# In QA we allow _synapse/admin from any IP so registration tests work; on VM you lock to localhost.
# QA: rate limiting is OFF so create_test_users and call tests never hit 429/503.
# QA: spread Synapse rate-limit keys by setting X-Forwarded-For to 10.0.0.$octet per connection
# (Synapse rate-limits by client IP; all tests from one host would otherwise share one bucket).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: matrix-qa
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /tmp/nginx.pid;
    events { worker_connections 1024; }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      log_format main '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';
      access_log /var/log/nginx/access.log main;
      sendfile on;
      keepalive_timeout 65;
      client_max_body_size 50M;
      # QA: per-connection "client IP" so Synapse sees many IPs and does not single-bucket rate limit
      map $connection $qa_ff_octet { "~([0-9]{1,2})$" $1; default 1; }

      server {
        listen 80;
        server_name _;

        location /.well-known/matrix/client {
          default_type application/json;
          add_header Access-Control-Allow-Origin * always;
          add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
          add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization" always;
          return 200 "{\"m.homeserver\":{\"base_url\":\"http://$host/\"}}";
        }

        # Allow OpenID userinfo for lk-jwt token validation; block rest of federation
        location = /_matrix/federation/v1/openid/userinfo {
          proxy_pass http://synapse:8008;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-For $remote_addr;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_http_version 1.1;
        }
        location /_matrix/federation { return 403; }
        location = /.well-known/matrix/server {
          default_type application/json;
          return 200 "{\"m.server\":\"qa.local:8448\"}";
        }

        location ~ ^/_synapse/admin {
          proxy_pass http://synapse:8008;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-For "10.0.0.$qa_ff_octet";
          proxy_http_version 1.1;
          proxy_connect_timeout 30s;
          proxy_send_timeout 120s;
          proxy_read_timeout 120s;
        }
        location = /_synapse/metrics {
          allow all;
          proxy_pass http://synapse:8008;
          proxy_set_header Host $host;
        }

        location = /_matrix/client/v3/login {
          proxy_pass http://synapse:8008;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-For "10.0.0.$qa_ff_octet";
          proxy_http_version 1.1;
        }
        location = /_matrix/client/v3/register {
          proxy_pass http://synapse:8008;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-For "10.0.0.$qa_ff_octet";
          proxy_http_version 1.1;
        }
        location = /_matrix/client/r0/login {
          proxy_pass http://synapse:8008;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-For "10.0.0.$qa_ff_octet";
          proxy_http_version 1.1;
        }
        location = /_matrix/client/r0/register {
          proxy_pass http://synapse:8008;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-For "10.0.0.$qa_ff_octet";
          proxy_http_version 1.1;
        }

        location /_matrix {
          proxy_pass http://synapse:8008;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-For "10.0.0.$qa_ff_octet";
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_http_version 1.1;
        }
        location /_synapse {
          proxy_pass http://synapse:8008;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-For "10.0.0.$qa_ff_octet";
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_http_version 1.1;
        }
        location / {
          return 200 'OK';
          add_header Content-Type text/plain;
        }
      }

      # HTTPS 443 + 8448: .well-known and OpenID userinfo for lk-jwt (gomatrixserverlib may try 443 or 8448).
      # Cert from secret nginx-tls-qa (create with ./nginx-tls-secret-qa.sh).
      server {
        listen 443 ssl;
        listen 8448 ssl;
        server_name _;
        ssl_certificate     /etc/nginx/ssl/tls.crt;
        ssl_certificate_key /etc/nginx/ssl/tls.key;
        location = /.well-known/matrix/server {
          default_type application/json;
          return 200 "{\"m.server\":\"qa.local:8448\"}";
        }
        location = /_matrix/federation/v1/openid/userinfo {
          proxy_pass http://synapse:8008;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-For $remote_addr;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_http_version 1.1;
        }
        location / { return 403; }
      }
    }
