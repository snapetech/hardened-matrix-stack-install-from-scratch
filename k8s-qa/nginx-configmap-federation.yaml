# Optional: use this ConfigMap when testing federation. Allows /_matrix/federation and serves .well-known/matrix/server.
# Apply and restart nginx: kubectl apply -f k8s-qa/nginx-configmap-federation.yaml && kubectl rollout restart deployment/nginx -n matrix-qa
# QA: rate limiting is OFF (same as no-federation config).
# QA: spread Synapse rate-limit keys via X-Forwarded-For 10.0.0.$octet per connection.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: matrix-qa
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /tmp/nginx.pid;
    events { worker_connections 1024; }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      log_format main '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';
      access_log /var/log/nginx/access.log main;
      sendfile on;
      keepalive_timeout 65;
      client_max_body_size 50M;
      map $connection $qa_ff_octet { "~([0-9]{1,2})$" $1; default 1; }

      server {
        listen 80;
        server_name _;

        location /.well-known/matrix/client {
          default_type application/json;
          add_header Access-Control-Allow-Origin * always;
          add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
          add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization" always;
          return 200 "{\"m.homeserver\":{\"base_url\":\"http://$host/\"}}";
        }

        location = /.well-known/matrix/server {
          default_type application/json;
          add_header Access-Control-Allow-Origin * always;
          return 200 "{\"m.server\":\"$host\"}";
        }

        location /_matrix/federation {
          proxy_pass http://synapse:8008;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-For "10.0.0.$qa_ff_octet";
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_http_version 1.1;
        }

        location ~ ^/_synapse/admin {
          proxy_pass http://synapse:8008;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-For "10.0.0.$qa_ff_octet";
          proxy_http_version 1.1;
          proxy_connect_timeout 30s;
          proxy_send_timeout 120s;
          proxy_read_timeout 120s;
        }
        location = /_synapse/metrics {
          allow all;
          proxy_pass http://synapse:8008;
          proxy_set_header Host $host;
        }

        location = /_matrix/client/v3/login {
          proxy_pass http://synapse:8008;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-For "10.0.0.$qa_ff_octet";
          proxy_http_version 1.1;
        }
        location = /_matrix/client/v3/register {
          proxy_pass http://synapse:8008;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-For "10.0.0.$qa_ff_octet";
          proxy_http_version 1.1;
        }
        location = /_matrix/client/r0/login {
          proxy_pass http://synapse:8008;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-For "10.0.0.$qa_ff_octet";
          proxy_http_version 1.1;
        }
        location = /_matrix/client/r0/register {
          proxy_pass http://synapse:8008;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-For "10.0.0.$qa_ff_octet";
          proxy_http_version 1.1;
        }

        location /_matrix {
          proxy_pass http://synapse:8008;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-For "10.0.0.$qa_ff_octet";
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_http_version 1.1;
        }
        location /_synapse {
          proxy_pass http://synapse:8008;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-For "10.0.0.$qa_ff_octet";
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_http_version 1.1;
        }
        location / {
          return 200 'OK';
          add_header Content-Type text/plain;
        }
      }
    }
