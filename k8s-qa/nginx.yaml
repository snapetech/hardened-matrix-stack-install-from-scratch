# nginx reverse proxy in front of Synapse: proxy, rate-limit (login/register), no-federation.
# All client traffic goes through nginx so we QA the same path as the VM installer.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: matrix-qa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              memory: "25Mi"
              cpu: "10m"
            limits:
              memory: "50Mi"
              cpu: "50m"
      volumes:
        - name: config
          configMap:
            name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: matrix-qa
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30048
      name: http
