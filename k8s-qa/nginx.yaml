# nginx reverse proxy in front of Synapse: proxy, rate-limit (login/register), no-federation.
# All client traffic goes through nginx so we QA the same path as the VM installer.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: matrix-qa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
              name: http
            - containerPort: 443
              name: https
            - containerPort: 8448
              name: federation
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tls
              mountPath: /etc/nginx/ssl
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              memory: "48Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "50m"
      volumes:
        - name: config
          configMap:
            name: nginx-config
        - name: tls
          secret:
            secretName: nginx-tls-qa
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: matrix-qa
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30048
      name: http
    - port: 443
      targetPort: 443
      name: https
    - port: 8448
      targetPort: 8448
      name: federation
