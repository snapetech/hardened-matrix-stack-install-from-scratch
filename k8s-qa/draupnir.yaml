# Draupnir moderation bot. Requires: moderation-bots-setup Job run and create-moderation-secrets-from-job.sh (Secret draupnir-config).
# Bots talk to Synapse directly (http://synapse:8008). Optional: ensure-moderation-bots-in-rooms CronJob to add bots to all rooms.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: draupnir
  namespace: matrix-qa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: draupnir
  template:
    metadata:
      labels:
        app: draupnir
    spec:
      initContainers:
        - name: write-config
          image: busybox:1.36
          env:
            - name: HOMESERVER_URL
              value: "http://synapse:8008"
          command:
            - /bin/sh
            - -c
            - |
              T="$(cat /secret/access_token)"
              R="$(cat /secret/management_room)"
              H="${HOMESERVER_URL:-http://synapse:8008}"
              cat << EOF > /out/production.yaml
              homeserverUrl: "$H"
              rawHomeserverUrl: "$H"
              accessToken: "$T"
              managementRoom: "$R"
              dataPath: /data/storage
              autojoinOnlyIfManager: true
              logLevel: INFO
              verifyPermissionsOnStartup: true
              noop: false
              EOF
          volumeMounts:
            - name: secret
              mountPath: /secret
              readOnly: true
            - name: out
              mountPath: /out
      containers:
        - name: draupnir
          image: gnuxie/draupnir:latest
          args:
            - bot
            - --draupnir-config
            - /data/config/production.yaml
          volumeMounts:
            - name: out
              mountPath: /data/config
              readOnly: true
            - name: data
              mountPath: /data/storage
      volumes:
        - name: secret
          secret:
            secretName: draupnir-config
        - name: out
          emptyDir: {}
        - name: data
          emptyDir: {}
