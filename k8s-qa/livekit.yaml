# LiveKit server + lk-jwt-service for Element Call / MatrixRTC in QA.
# Requires Synapse (OpenID). NodePorts: LiveKit WS 30049, lk-jwt HTTP 30050.
---
apiVersion: v1
kind: Secret
metadata:
  name: livekit
  namespace: matrix-qa
type: Opaque
stringData:
  LIVEKIT_KEY: "qa-livekit-key"
  LIVEKIT_SECRET: "qa-livekit-secret-min-32-chars-long"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: livekit-config
  namespace: matrix-qa
data:
  livekit.yaml: |
    port: 7880
    rtc:
      port_range_start: 50000
      port_range_end: 50200
      tcp_port: 7881
      use_external_ip: false
    keys:
      qa-livekit-key: "qa-livekit-secret-min-32-chars-long"
---
apiVersion: v1
kind: Service
metadata:
  name: livekit
  namespace: matrix-qa
spec:
  type: NodePort
  selector:
    app: livekit
  ports:
    - port: 7880
      targetPort: 7880
      nodePort: 30049
      name: ws
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
  namespace: matrix-qa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: livekit
  template:
    metadata:
      labels:
        app: livekit
    spec:
      containers:
        - name: livekit
          image: livekit/livekit-server:v1.9.4
          args: ["--config", "/etc/livekit.yaml"]
          env:
            - name: LIVEKIT_PORT
              value: "7880"
          ports:
            - containerPort: 7880
            - containerPort: 7881
          volumeMounts:
            - name: config
              mountPath: /etc/livekit.yaml
              subPath: livekit.yaml
          resources:
            requests:
              memory: "120Mi"
              cpu: "150m"
            limits:
              memory: "200Mi"
              cpu: "300m"
      volumes:
        - name: config
          configMap:
            name: livekit-config
---
apiVersion: v1
kind: Service
metadata:
  name: lk-jwt
  namespace: matrix-qa
spec:
  type: NodePort
  selector:
    app: lk-jwt
  ports:
    - port: 6080
      targetPort: 6080
      nodePort: 30050
      name: http
---
# lk-jwt: scaled for concurrent load (e.g. 20 participants hitting /get_token at once).
# Multiple replicas + higher CPU/memory so token issuance + OpenID validation don't time out.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lk-jwt
  namespace: matrix-qa
spec:
  replicas: 4
  selector:
    matchLabels:
      app: lk-jwt
  template:
    metadata:
      labels:
        app: lk-jwt
    spec:
      # lk-jwt must reach LiveKit in-cluster (ws://livekit:7880). For OpenID validation
      # it looks up the Matrix server by name (qa.local); qa.local must resolve to nginx.
      # run-ramp-k8s.sh patches hostAliases to the current nginx ClusterIP each run.
      hostAliases:
        - ip: "10.43.101.44"
          hostnames:
            - "qa.local"
      containers:
        - name: lk-jwt
          image: ghcr.io/element-hq/lk-jwt-service:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: LIVEKIT_JWT_PORT
              value: "6080"
            - name: LIVEKIT_URL
              value: "ws://livekit:7880"
            - name: LIVEKIT_FULL_ACCESS_HOMESERVERS
              value: "*"
            - name: LIVEKIT_INSECURE_SKIP_VERIFY_TLS
              value: "YES_I_KNOW_WHAT_I_AM_DOING"
            - name: LIVEKIT_KEY
              valueFrom:
                secretKeyRef:
                  name: livekit
                  key: LIVEKIT_KEY
            - name: LIVEKIT_SECRET
              valueFrom:
                secretKeyRef:
                  name: livekit
                  key: LIVEKIT_SECRET
          ports:
            - containerPort: 6080
          resources:
            requests:
              memory: "80Mi"
              cpu: "75m"
            limits:
              memory: "160Mi"
              cpu: "250m"