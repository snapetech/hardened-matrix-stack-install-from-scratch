# 16c/32 hyperthread. 20 loadtest @ 2c limit = 40c (oversubscribes 32 to drive load). Stack ~5c. Quota 48c.
# run-ramp-k8s: (limit - used - 500m) / 2000m = max participants. Participant limit 2c so load test drives CPU.
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: matrix-qa-quota
  namespace: matrix-qa
spec:
  hard:
    pods: "30"
    requests.cpu: "15000m"
    requests.memory: "24Gi"
    limits.cpu: "48000m"
    limits.memory: "96Gi"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: matrix-qa-defaults
  namespace: matrix-qa
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: "25m"
        memory: "32Mi"
      default:
        cpu: "100m"
        memory: "96Mi"
