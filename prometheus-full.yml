# Prometheus config template. Setup script seds example.com / matrix.example.com to your SERVER_NAME / MATRIX_DOMAIN.
# Synapse + Prometheus self + node exporter.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    monitor: 'matrix'

rule_files:
  - /etc/prometheus/prometheus-alerts.yml
  - /etc/prometheus/prometheus-recording-rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  - job_name: node
    static_configs:
      - targets: ['localhost:9100']
  - job_name: synapse
    metrics_path: /_synapse/metrics
    scrape_interval: 30s
    static_configs:
      - targets: ['127.0.0.1:9000']
        labels:
          instance: matrix
