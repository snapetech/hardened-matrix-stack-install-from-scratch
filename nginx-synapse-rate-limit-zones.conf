# Rate limit zones for Synapse login/register. Include in http { } block only
# (e.g. in /etc/nginx/nginx.conf inside http { }, or a file included there).
# Then include nginx-synapse-hardening.conf inside the matrix server { } block.
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=reg_zone:10m rate=1r/s;
