# Root domain: serve /.well-known/matrix/client for @user:example.com discovery.
# Matrix spec: autodiscovery for @alice:example.com goes to
# https://example.com/.well-known/matrix/client — MUST offer CORS.
# Deploy as /etc/nginx/sites-available/root-wellknown (or your root domain). Setup script generates this from ROOT_DOMAIN/MATRIX_DOMAIN.
#
# Requires: SSL cert for your root domain (e.g. certbot). Listen 443 ssl http2.

server {
    listen 443 ssl;
    http2 on;
    server_name example.com;

    # Let's Encrypt / certbot; adjust paths if different
    # ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;

    location = /.well-known/matrix/client {
        default_type application/json;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization" always;

        return 200 '{"m.homeserver":{"base_url":"https://matrix.example.com"}}';
    }

    # Optional: redirect humans to the web UI
    location / {
        return 302 https://matrix.example.com$request_uri;
    }
}
