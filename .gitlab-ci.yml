workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages:
  - build
  - scan

variables:
  DOCKER_BUILDKIT: "1"
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  LOAD_TEST_IMAGE_TAG: "$CI_REGISTRY_IMAGE/load-test:${CI_COMMIT_REF_SLUG}"
  LOAD_TEST_IMAGE_SHA_TAG: "$CI_REGISTRY_IMAGE/load-test:${CI_COMMIT_SHORT_SHA}"

docker:load-test:
  stage: build
  image: docker:27.5.1
  services:
    - name: docker:27.5.1-dind
      command: ["--mtu=1450"]
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker buildx create --use --name gitlab-builder
  script:
    - >
      docker buildx build
      --file load-test/Dockerfile
      --tag "$LOAD_TEST_IMAGE_TAG"
      --tag "$LOAD_TEST_IMAGE_SHA_TAG"
      --push
      load-test
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker buildx imagetools create --tag "$CI_REGISTRY_IMAGE/load-test:$CI_COMMIT_TAG" "$LOAD_TEST_IMAGE_SHA_TAG"
      fi

.trivy_scan:
  stage: scan
  image:
    name: aquasec/trivy:0.58.2
    entrypoint: [""]
  script:
    - trivy image --username "$CI_REGISTRY_USER" --password "$CI_REGISTRY_PASSWORD" --exit-code 0 --severity HIGH,CRITICAL "$CS_IMAGE"

container_scanning:load-test:
  extends: .trivy_scan
  needs: ["docker:load-test"]
  variables:
    CS_IMAGE: "$LOAD_TEST_IMAGE_SHA_TAG"
  rules:
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'
