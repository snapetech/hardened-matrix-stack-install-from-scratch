# Grafana dashboard provisioning. Point Grafana at this file (or copy into your provisioning dir).
# Set the path below to the directory containing the JSON dashboards (e.g. this repo's grafana/dashboards).
apiVersion: 1
providers:
  - name: 'matrix'
    folder: 'Matrix'
    folderUid: 'matrix'
    type: file
    options:
      path: /etc/grafana/provisioning/dashboards/matrix
    disableDeletion: false
