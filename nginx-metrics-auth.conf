# Login sends Matrix credentials; cookie holds access token; must be HTTPS only.
# 1) Run metrics-auth-proxy.py on 127.0.0.1:9091 (see README Monitoring section).
# 2) Bind Prometheus to 127.0.0.1 and set URL/prefix (in /etc/default/prometheus add to ARGS: --web.listen-address=127.0.0.1:9090 --web.external-url=https://matrix.example.com/metrics/ --web.route-prefix=/).
# 3) Add these locations to the 443 server block for your Matrix host (before other _matrix or / locations).
