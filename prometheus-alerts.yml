# Prometheus alerting rules for Matrix stack.
# Place in /etc/prometheus/prometheus-alerts.yml and reference in rule_files.
# Use with Alertmanager and/or Grafana alerting.
---
groups:
  - name: synapse
    interval: 1m
    rules:
      # Synapse down or not scraping
      - alert: SynapseDown
        expr: up{job="synapse"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Synapse is down or not scraped on {{ $labels.instance }}"
          description: "Prometheus has not received metrics from Synapse for 2m."

      # High event send latency (p99) — user-visible slowness
      - alert: SynapseHighEventSendLatency
        expr: |
          histogram_quantile(0.99,
            sum(rate(synapse_http_server_response_time_seconds_bucket{
              servlet="RoomSendEventRestServlet",job="synapse",code=~"2.."
            }[5m])) by (le)
          ) > 2
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Synapse event send p99 latency high on {{ $labels.instance }}"
          description: "99th percentile room message send time > 2s for 10m."

      # Reactor tick lag — event loop falling behind (Twisted)
      - alert: SynapseReactorLag
        expr: |
          histogram_quantile(0.99,
            sum(rate(python_twisted_reactor_tick_time_bucket{job="synapse"}[5m])) by (le)
          ) > 0.5
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Synapse reactor tick lag high on {{ $labels.instance }}"
          description: "99th percentile reactor tick time > 0.5s; processing may be falling behind."

      # Synapse process memory growing (RSS)
      - alert: SynapseHighMemory
        expr: process_resident_memory_bytes{job="synapse"} > 800 * 1024 * 1024
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Synapse RSS high on {{ $labels.instance }}"
          description: "Synapse process resident memory > 800 MiB for 10m (small box has ~1 GiB)."

      # HTTP 5xx rate (from response time histogram count by code)
      - alert: SynapseHigh5xxRate
        expr: |
          sum(rate(synapse_http_server_response_time_seconds_count{job="synapse",code=~"5.."}[5m])) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Synapse 5xx response rate high on {{ $labels.instance }}"

  - name: node
    interval: 1m
    rules:
      - alert: NodeDown
        expr: up{job="node"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Node exporter down on {{ $labels.instance }}"

      - alert: LowMemoryAvailable
        expr: node_memory_MemAvailable_bytes < 100 * 1024 * 1024
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Low memory available on {{ $labels.instance }}"
          description: "Less than 100 MiB available (small box)."

      - alert: LowDiskSpace
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.1
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Low disk space on root on {{ $labels.instance }}"
          description: "Less than 10% free on /."

      - alert: HighDiskIO
        expr: rate(node_disk_io_time_seconds_total[5m]) > 0.9
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "High disk I/O utilization on {{ $labels.instance }}"

  - name: prometheus
    interval: 1m
    rules:
      - alert: PrometheusDown
        expr: up{job="prometheus"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Prometheus is down on {{ $labels.instance }}"

      - alert: PrometheusScrapeFailures
        expr: rate(scrape_samples_failed_total{job=~"synapse|node"}[5m]) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Scrape failures for {{ $labels.job }} on {{ $labels.instance }}"
