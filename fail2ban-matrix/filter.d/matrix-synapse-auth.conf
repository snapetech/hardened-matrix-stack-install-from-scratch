# Fail2ban filter for Synapse login failures (nginx access log).
# Install: copy to /etc/fail2ban/filter.d/matrix-synapse-auth.conf
# Jail: see jail.d/matrix-synapse-auth.conf
# Wiring: client -> nginx (logs + rate-limit) -> Synapse (x_forwarded: true) -> 401 logged -> fail2ban bans IP.

[Definition]
# Nginx combined: $remote_addr - $remote_user [$time_local] "$request" $status ...
failregex = ^<HOST> - .* "(GET|POST|HEAD) [^"]*_matrix/client[^"]*(login|register)[^"]*" (401|403|429) 
ignoreregex =
# Nginx combined timestamp e.g. [11/Feb/2026:22:00:00 +0000] — required for findtime
datepattern = \[%%d/%%b/%%Y:%%H:%%M:%%S
