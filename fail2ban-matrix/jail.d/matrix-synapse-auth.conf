# Fail2ban jail: ban IPs with repeated Matrix login/register failures.
# Install: copy to /etc/fail2ban/jail.d/matrix-synapse-auth.conf
# Requires: filter.d/matrix-synapse-auth.conf; nginx must log to access log and pass client IP.
# Reload: sudo fail2ban-client reload

[matrix-synapse-auth]
enabled = true
port = http,https
filter = matrix-synapse-auth
logpath = /var/log/nginx/access.log
maxretry = 5
findtime = 10m
bantime = 1h
