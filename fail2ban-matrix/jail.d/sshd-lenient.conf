# sshd jail: 10 failures in 10m required before ban. Once banned, SSH bans
# are permanent until manually cleared (unbanip or whitelist).
# Reload: sudo fail2ban-client reload
# Unban: fail2ban-client set sshd unbanip <ip> or ./fail2ban-whitelist-ssh-client.sh

[sshd]
enabled = true
maxretry = 10
findtime = 10m
bantime = -1
