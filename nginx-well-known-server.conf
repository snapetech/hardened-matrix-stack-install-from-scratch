# Federation server discovery. Include in the 443 server block for your Matrix host.
# Deploy: copy this to /etc/nginx/snippets/well-known-matrix-server.conf
# and add: include /etc/nginx/snippets/well-known-matrix-server.conf; inside the server { } block.
location /.well-known/matrix/server {
    default_type application/json;
    alias /var/www/matrix-well-known/.well-known/matrix/server;
}
